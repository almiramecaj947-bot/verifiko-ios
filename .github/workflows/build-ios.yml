name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest available Xcode
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then LATEST=/Applications/Xcode.app; fi
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app for device
        run: |
          xcodebuild -project Verifiko.xcodeproj -scheme Verifiko -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Compile app icon into bundle (workaround for missing Assets.car)
        run: |
          APP_PATH="$(pwd)/build/Build/Products/Release-iphoneos/Verifiko.app"
          echo "--- before ---"
          ls -la "$APP_PATH"
          mkdir -p /tmp/actool_out
          xcrun actool Assets.xcassets \
            --compile "$APP_PATH" \
            --platform iphoneos \
            --minimum-deployment-target 15.0 \
            --app-icon AppIcon \
            --output-partial-info-plist /tmp/actool_out/partial-info.plist \
            --target-device iphone
          python3 -c "import plistlib; d = plistlib.load(open('$APP_PATH/Info.plist', 'rb')); p = plistlib.load(open('/tmp/actool_out/partial-info.plist', 'rb')); d.update(p); plistlib.dump(d, open('$APP_PATH/Info.plist', 'wb')); print('merged keys:', list(p.keys()))"
          echo "--- after ---"
          ls -la "$APP_PATH"
          plutil -p "$APP_PATH/Info.plist" | grep -i icon

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Verifiko.app Payload/
          zip -r Verifiko.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Verifiko-ipa
          path: Verifiko.ipa
